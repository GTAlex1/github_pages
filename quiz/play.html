<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Orion</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--blue2:#79b8e8;--c0:#e8703a;--c1:#428bbd;--c2:#d29922;--c3:#3fb950;--ok:#3fb950;--red:#f85149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 90% 0,rgba(232,112,58,.2),transparent 45%),var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{height:100%;max-width:560px;margin:0 auto;position:relative}
.v{display:none;height:100%;padding:22px 18px;flex-direction:column;gap:14px;animation:in .35s}.v.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:44px;line-height:1.05;margin:8px 0 0}.mut{color:var(--mut)}
input{width:100%;font:700 22px system-ui;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--tx);outline:none}
input:focus{border-color:var(--c1)}#pinin{letter-spacing:.25em;text-align:center;font-family:ui-monospace,Consolas,monospace}
button.go{background:#238636;color:#fff;border:0;border-radius:12px;padding:15px;font:800 20px system-ui;cursor:pointer;transition:transform .12s}button.go:active{transform:scale(.96)}button.go:disabled{background:#21262d;color:var(--mut)}
#err{color:var(--red);min-height:1.4em;margin:0}
.center{align-items:center;justify-content:center;text-align:center}
.msg{font-size:26px;font-weight:800}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue2);margin:0 4px;animation:bl 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2;transform:scale(.6)}}
.tbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;flex:none}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c0),var(--blue2));transition:width .12s linear}
#qt{margin:0;font-size:20px;font-weight:700;flex:none}
.opts{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:10px;min-height:0}
.opt{border:0;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 16px;font:800 20px/1.2 system-ui;text-align:left;color:#0d1117;cursor:pointer;transition:transform .12s,opacity .3s;animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.opt:active{transform:scale(.96)}.opt b{font-size:28px;width:34px;text-align:center;flex:none}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.o0{background:var(--c0)}.o1{background:var(--c1);color:#fff}.o2{background:var(--c2)}.o3{background:var(--c3)}
.opts.done .opt{opacity:.25;pointer-events:none}.opts.done .opt.pick{opacity:1;outline:4px solid #fff}
.ico{font-size:72px;line-height:1;animation:pop .6s cubic-bezier(.2,2,.4,1)}
#v-res{justify-content:flex-start;overflow:auto;gap:8px}
.recap{width:100%;text-align:left;margin-top:6px}.recap p{margin:0 0 4px;font-weight:700;color:var(--mut);font-size:16px}
.ro{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;font:700 17px/1.2 system-ui;margin-top:8px;color:#0d1117;animation:pop .4s backwards}
.ro.o1{color:#fff}.ro b{font-size:22px;width:28px;text-align:center;flex:none}.ro.pick{outline:3px solid #fff}
.ro .tag{margin-left:auto;font-size:12px;font-style:normal;background:rgba(0,0,0,.3);color:#fff;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pts{font:800 40px ui-monospace,Consolas,monospace}
.good{color:var(--ok)}.bad{color:var(--red)}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 22px;font-weight:700}
</style>
</head>
<body>
<main>
  <section class="v on" id="v-join">
    <h1>Quiz Orion</h1>
    <p class="mut">Mira la pantalla, escribe el PIN y elige un nombre.</p>
    <input id="pinin" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <input id="namein" maxlength="16" placeholder="Tu nombre" autocomplete="off">
    <button class="go" id="b-join">Entrar</button>
    <p id="err"></p>
  </section>

  <section class="v center" id="v-wait"><div class="msg" id="w-msg"></div><div class="dots"><span></span><span></span><span></span></div></section>

  <section class="v" id="v-q">
    <div class="tbar"><i id="tb"></i></div>
    <p id="qt"></p>
    <div class="opts" id="opts"></div>
  </section>

  <section class="v center" id="v-res">
    <div class="ico" id="r-ico"></div>
    <div class="msg" id="r-msg"></div>
    <div class="pts" id="r-pts"></div>
    <div class="rank" id="r-rank"></div>
    <div class="recap" id="r-recap"><p id="r-q"></p><div id="r-opts"></div></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const SHAPES = ['▲', '◆', '●', '■'];
const view = (id, msg) => { $$('.v').forEach(v => v.classList.toggle('on', v.id === id)); if (msg !== undefined) $('#w-msg').textContent = msg; };
const cfg = window.FIREBASE_CONFIG;

if (!cfg || /PEGA/i.test(cfg.apiKey || '') || typeof firebase === 'undefined') {
  $('#err').textContent = 'Este quiz todavía no está configurado.'; $('#b-join').disabled = true;
} else init();

function init() {
  firebase.initializeApp(cfg);
  const db = firebase.database(), auth = firebase.auth(), SV = firebase.database.ServerValue;
  const S = { state: null, q: -1, question: null, t0: 0, reveal: null, scores: {} };
  let uid, pin, ref, name, offset = 0, mine = {}, drawn = -1, tmr = null, ready = false;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);

  const qp = new URLSearchParams(location.search).get('pin');
  if (qp) $('#pinin').value = qp.replace(/\D/g, '').slice(0, 6);
  try { const n = localStorage.getItem('quiz-name'); if (n) $('#namein').value = n; } catch (e) {}

  auth.signInAnonymously().then(async () => {
    uid = auth.currentUser.uid; ready = true;
    try {   // si recargas la página, vuelves a tu sala
      const saved = JSON.parse(localStorage.getItem('quiz-room') || 'null');
      if (saved && (!qp || qp === saved.pin)) {
        const p = await db.ref('rooms/' + saved.pin + '/players/' + uid).get(), st = await db.ref('rooms/' + saved.pin + '/state').get();
        if (p.exists() && st.exists() && st.val() !== 'ended') { pin = saved.pin; name = p.val().name; enter(); }
      }
    } catch (e) {}
  }).catch(e => { $('#err').textContent = 'No se pudo conectar (' + (e.code || e.message) + ').'; });

  $('#b-join').onclick = async () => {
    const p = $('#pinin').value.trim(), n = $('#namein').value.trim(), err = $('#err'); err.textContent = '';
    if (!ready) { err.textContent = 'Conectando… prueba otra vez en un segundo.'; return; }
    if (!/^\d{6}$/.test(p)) { err.textContent = 'El PIN tiene 6 números.'; return; }
    if (!n) { err.textContent = 'Escribe tu nombre.'; return; }
    $('#b-join').disabled = true;
    try {
      const st = await db.ref('rooms/' + p + '/state').get();
      if (!st.exists()) throw { m: 'No existe ninguna sala con ese PIN.' };
      if (st.val() === 'ended') throw { m: 'Esa partida ya terminó.' };
      await db.ref('rooms/' + p + '/players/' + uid).set({ name: n });
      pin = p; name = n;
      try { localStorage.setItem('quiz-name', n); } catch (e) {}
      enter();
    } catch (e) { err.textContent = e.m || 'No se pudo entrar (' + (e.code || e.message) + ').'; $('#b-join').disabled = false; }
  };

  function enter() {
    try { localStorage.setItem('quiz-room', JSON.stringify({ pin })); } catch (e) {}
    ref = db.ref('rooms/' + pin);
    ['state', 'q', 'question', 't0', 'reveal', 'scores'].forEach(k => ref.child(k).on('value', s => { S[k] = s.val(); render(); }));
    view('v-wait', '¡Dentro, ' + name + '!');
  }

  async function render() {
    if (!S.state) return;
    if (S.state === 'lobby') { view('v-wait', '¡Dentro, ' + name + '! Mira la pantalla…'); return; }
    if (S.state === 'question') {
      if (!S.question || S.question.i !== S.q || !S.t0) { view('v-wait', 'Preparando…'); return; }
      if (drawn !== S.q) { drawn = S.q; drawQuestion(); }
      view('v-q'); return;
    }
    if (S.state === 'reveal') { showResult(false); return; }
    if (S.state === 'ended') { showResult(true); }
  }

  async function drawQuestion() {
    const Q = S.question, qi = S.q; clearInterval(tmr);
    $('#qt').textContent = Q.text;
    const box = $('#opts'); box.className = 'opts'; box.innerHTML = '';
    (Array.isArray(Q.options) ? Q.options : Object.values(Q.options)).forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt o' + i;
      const sh = document.createElement('b'); sh.textContent = SHAPES[i]; const tx = document.createElement('span'); tx.textContent = o;
      b.append(sh, tx); b.onclick = () => answer(qi, i, b); box.append(b);
    });
    tmr = setInterval(() => {
      const left = Math.max(0, Q.limit - (Date.now() + offset - S.t0) / 1000);
      $('#tb').style.width = (left / Q.limit * 100) + '%';
      if (left <= 0) { clearInterval(tmr); box.classList.add('done'); }
    }, 100);
    try { const mineAns = await ref.child('answers/' + qi + '/' + uid).get(); if (mineAns.exists() && drawn === qi) { mine[qi] = mineAns.val().a; box.classList.add('done'); box.children[mine[qi]].classList.add('pick'); } } catch (e) {}
  }

  async function answer(qi, i, btn) {
    if (mine[qi] !== undefined) return; mine[qi] = i;
    const box = $('#opts'); box.classList.add('done'); btn.classList.add('pick');
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    try { await ref.child('answers/' + qi + '/' + uid).set({ a: i, t: SV.TIMESTAMP }); }
    catch (e) { delete mine[qi]; box.classList.remove('done'); btn.classList.remove('pick'); }
  }

  function rankInfo() {
    const arr = Object.keys(S.scores || {}).map(id => ({ id, s: S.scores[id] })).sort((a, b) => b.s - a.s), i = arr.findIndex(r => r.id === uid);
    return { pos: i < 0 ? arr.length + 1 : i + 1, total: arr.length, score: (S.scores || {})[uid] || 0 };
  }

  function showResult(final) {
    clearInterval(tmr); const r = rankInfo();
    if (final) {
      $('#r-ico').textContent = r.pos === 1 ? '🏆' : r.pos <= 3 ? '🎉' : '👏';
      $('#r-msg').textContent = r.pos <= 3 ? '¡Has quedado en el puesto ' + r.pos + '!' : 'Has quedado en el puesto ' + r.pos;
      $('#r-msg').className = 'msg good'; $('#r-pts').textContent = r.score + ' puntos'; $('#r-rank').textContent = 'Gracias por jugar'; $('#r-recap').style.display = 'none';
      try { localStorage.removeItem('quiz-room'); } catch (e) {}
    } else {
      const rv = S.reveal || {}, ok = mine[S.q] === rv.correct, got = (rv.pts && rv.pts[uid]) || 0, none = mine[S.q] === undefined;
      $('#r-ico').textContent = ok ? '✅' : none ? '⏰' : '❌';
      $('#r-msg').textContent = ok ? '¡Correcto!' : none ? 'Sin respuesta' : 'Incorrecto'; $('#r-msg').className = 'msg ' + (ok ? 'good' : 'bad');
      $('#r-pts').textContent = ok ? '+' + got : '+0';
      $('#r-rank').textContent = 'Puesto ' + r.pos + (r.total ? ' de ' + r.total : '') + ' · ' + r.score + ' puntos';
      // recordatorio de qué era cada opción (sin decir cuál era la correcta: eso solo sale en la pantalla del presentador)
      const Q = S.question, box = $('#r-opts'); box.innerHTML = '';
      $('#r-recap').style.display = Q ? '' : 'none';
      if (Q) {
        $('#r-q').textContent = Q.text;
        (Array.isArray(Q.options) ? Q.options : Object.values(Q.options)).forEach((o, i) => {
          const d = document.createElement('div'); d.className = 'ro o' + i + (mine[S.q] === i ? ' pick' : '');
          const sh = document.createElement('b'); sh.textContent = SHAPES[i]; const tx = document.createElement('span'); tx.textContent = o; d.append(sh, tx);
          if (mine[S.q] === i) { const tg = document.createElement('em'); tg.className = 'tag'; tg.textContent = 'Tu respuesta'; d.append(tg); }
          box.append(d);
        });
      }
    }
    view('v-res');
  }
}
</script>
</body>
</html>
